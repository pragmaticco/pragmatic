# The server's log key: an Ed25519 signed-note key named for the log's
# origin. Do not commit a real key: create the secret from a key file,
#   pragmatic-server --config <your config> keygen   (writes the key file and
#                                                     prints the vkey auditors pin)
#   kubectl create secret generic pragmatic-signing-key \
#     --from-file=server.ed25519=./server.ed25519
# This manifest documents the shape only.
apiVersion: v1
kind: Secret
metadata:
  name: pragmatic-signing-key
  labels:
    app.kubernetes.io/name: pragmatic-server
type: Opaque
stringData:
  server.ed25519: |
    PRIVATE+KEY+pragmatic/<name>/<log id>+<key id>+REPLACE-WITH-YOUR-KEY

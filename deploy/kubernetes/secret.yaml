# The server's Ed25519 signing key. Do not commit a real key: create the
# secret from a key file instead,
#   pragmatic-server --config <any config> keygen   (writes the key file)
#   kubectl create secret generic pragmatic-signing-key \
#     --from-file=server.ed25519=./server.ed25519
# This manifest documents the shape only.
apiVersion: v1
kind: Secret
metadata:
  name: pragmatic-signing-key
  labels:
    app.kubernetes.io/name: pragmatic-server
type: Opaque
stringData:
  server.ed25519: |
    -----BEGIN PRIVATE KEY-----
    REPLACE-WITH-YOUR-KEY
    -----END PRIVATE KEY-----

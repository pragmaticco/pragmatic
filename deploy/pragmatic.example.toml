# Pragmatic Server configuration.
#
# Every key is shown with its default unless the comment says otherwise.
# Unknown keys are refused at startup, so a typo cannot silently fall back
# to a default. The full reference is docs/server.md.

# The server's name. Anchoring checkpoints use the origin
# "pragmatic/<name>/<log id>", the log id being fixed by the log's first
# key. Empty means the host name.
name = ""

# The address to listen on, as IP:port. A non-loopback address needs
# allow_plain_http = true: the server speaks plain HTTP, so TLS must
# terminate at a proxy or ingress in front of it.
listen = "127.0.0.1:7272"
data_dir = "/var/lib/pragmatic"
allow_plain_http = false

# The header your proxy puts the client address in, such as
# "x-forwarded-for". Empty means the address of the connecting peer.
# Only set this when every request reaches the server through that proxy.
trusted_proxy_header = ""

lease_ttl_secs = 60
max_request_bytes = 268435456
max_clock_skew_secs = 300

# The URL clients and the console use. An https:// URL makes console
# cookies Secure.
public_url = ""

# How often every chain, commitment and anchor proof is verified again.
verify_interval_hours = 24

[keys]
# Ed25519 key in PKCS#8 PEM, written by `pragmatic-server keygen` (or
# `openssl genpkey -algorithm ed25519`). Refused inside data_dir.
signing_key_file = "/etc/pragmatic/server.ed25519"
allow_key_in_data_dir = false

[bootstrap]
# SHA-256 (lowercase hex) of the first admin token. Generate one with
# `pragmatic-server token bootstrap`. Every other token is issued through
# the API.
admin_token_sha256 = ""

[anchoring]
# Seconds between anchoring batches, 60 to 3600.
interval_secs = 600

# Independent witnesses. At least one TSA or witness is required unless
# allow_self_anchoring = true. Obtain written permission from TSA operators
# before automated use; qualified (eIDAS) time-stamping providers are a paid
# option. The pinned roots ship in deploy/tsa-roots/.
tsa = [
  { url = "http://timestamp.digicert.com", roots_pem = "/etc/pragmatic/tsa-roots/digicert_g4.pem", operator = "digicert" },
  { url = "http://timestamp.sectigo.com", roots_pem = "/etc/pragmatic/tsa-roots/usertrust_rsa.pem", operator = "sectigo" },
]
# C2SP tlog-witness cosigners, for example the hosted Pragmatic Witness:
# witness = [ { url = "https://witness.example", public_key = "<64 hex>", token_file = "/etc/pragmatic/witness.token", name = "witness.example", operator = "example" } ]
witness = []
allow_self_anchoring = false
# "plain" puts run ids in anchor leaves; "hmac" puts a keyed hash instead.
anchor_run_ids = "plain"
# Distinct witness operators a checkpoint needs to count as independently
# anchored.
min_independent_operators = 2

# Retention policies. When several match a run, the most restrictive value
# of each wins (see docs/server.md). Days count from the run's last append.
# [[retention]]
# match = { prefix = "", labels = {} }
# retain_min_days = 0
# shred_after_days = 0          # 0 = never
# delete_after_days = 0         # 0 = never
# erasure = "allow"             # or "deny_during_min"

[redaction]
# Detectors applied to content shown to tokens without view_raw.
builtin = ["email", "phone", "ssn", "card", "iban", "ipv4", "secret"]
# Extra regular expressions; matches become "[redacted]".
patterns = []

# Signed webhooks. The body carries the event, run id and counts, never
# content. Header: Pragmatic-Signature: sha256=<HMAC-SHA-256(secret, body)>.
# [[webhooks]]
# url = "https://alerts.example/pragmatic"
# secret_file = "/etc/pragmatic/webhook.secret"
# events = ["chain_broken", "anchor_failed", "regressed", "erasure", "retention", "dangling_effect", "clock_skew", "record_missing", "hold", "access_log_failed"]

[witness_mode]
# Cosign checkpoints of other logs (C2SP tlog-witness).
enabled = false
# origins = [ { name = "example.com/log", token_sha256 = "<64 hex>", public_key = "example.com/log+<key id>+<base64 key>" } ]
origins = []

[license]
# Shown in the console footer and in /v1/info. Nothing is enforced.
licensee = ""

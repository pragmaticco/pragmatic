[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pragmatic-runtime"
description = "The black-box recorder for LLM agents: journal every model and tool call of your Anthropic or OpenAI SDK agent, resume crashed runs without re-paying for tokens, and replay any run exactly for audit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Pragmatic Research, Inc.", email = "me@aniketh.net" }]
keywords = ["agents", "llm", "anthropic", "openai", "audit", "durable-execution", "replay", "crash-recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://aniketh.net/pragmatic/"
Repository = "https://github.com/pragmaticco/pragmatic"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[tool.maturin]
module-name = "pragmatic._native"
python-source = "python"
features = ["pyo3/extension-module"]

[package]
name = "pragmatic-python"
description = "Python bindings for the Pragmatic durable-execution runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false # distributed via PyPI (maturin), not crates.io

# The extension is `pragmatic._native`, wrapped by the pure-Python package
# in `python/pragmatic/`. The Rust core dependency is renamed so it cannot
# be confused with the importable package.
[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pragmatic_rt = { package = "pragmatic", version = "0.5.0", path = "../pragmatic", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[package]
name = "pragmatic-cli"
description = "Journal tooling for the Pragmatic durable-execution runtime: list, inspect, verify, and export run timelines."
keywords = ["agents", "llm", "durable-execution", "cli"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

[[bin]]
name = "pragmatic"
path = "src/main.rs"

# Zero dependencies beyond the core, like the core itself.
[dependencies]
pragmatic = { version = "0.5.0", path = "../pragmatic", default-features = false }

[package]
name = "pragmatic-anthropic"
description = "Anthropic Messages API adapter for the Stet durable-execution runtime: Claude as a journaled Oracle."
keywords = ["anthropic", "claude", "llm", "agents", "durable-execution"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

# The zero-dependency rule applies to the core runtime. Adapters talk to the
# outside world, so they carry the minimum needed to do it well: an HTTPS
# client and a JSON codec.
[dependencies]
pragmatic = { version = "0.6.0", path = "../pragmatic", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

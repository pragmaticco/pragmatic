[package]
name = "pragmatic"
description = "Durable execution for agents that don't run deterministically. Journals every step an agent takes, so it survives any crash and replays exactly - nondeterministic model behavior included."
keywords = ["agents", "llm", "durable-execution", "replay", "crash-recovery"]
categories = ["asynchronous", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

# The core runtime has ZERO runtime dependencies: it links into the agent you
# already run, on the infra you already have. The only (default) dependency is
# the compile-time `#[pragmatic::durable]` attribute macro; disable default
# features for a fully dependency-free build.
[dependencies]
pragmatic-macros = { version = "0.5.0", path = "../pragmatic-macros", optional = true }

[features]
default = ["macros"]
macros = ["dep:pragmatic-macros"]
# Crash-simulation hooks for test suites: `Backend::crash_truncate`,
# `Runtime::crash_truncate` and `Runtime::with_journal_mut`, plus a writer
# for format 1 fixtures.
testing = []

# The integration tests and examples simulate crashes through the `testing`
# hooks, so they build against this crate with that feature on.
[dev-dependencies]
pragmatic = { path = ".", features = ["testing"] }

[package]
name = "pragmatic-server"
description = "Pragmatic Server: the system of record for AI agent runs. Stores journals with leases, access control, erasure, retention, redaction, an access log and anchoring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# Commercial: the source is public under the Business Source License 1.1
# (see LICENSE in this directory), and the crate is never published to
# crates.io. It ships as a container image and binaries.
license = "BUSL-1.1"
publish = false

[[bin]]
name = "pragmatic-server"
path = "src/main.rs"

[lib]
name = "pragmatic_server"
path = "src/lib.rs"

[dependencies]
pragmatic = { version = "0.5.0", path = "../pragmatic", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "matched-path", "original-uri"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
ed25519-dalek = "2"
subtle = "2"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
http-body-util = "0.1"
futures-core = "0.3"
form_urlencoded = "1"
percent-encoding = "2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
pragmatic = { path = "../pragmatic", features = ["testing"] }
pragmatic-server = { path = ".", features = ["testing"] }

[features]
# Hooks for tests: failure injection in the access log and an anchoring
# implementation that anchors every batch at once.
testing = []

[package]
name = "pragmatic-openai"
description = "OpenAI-compatible Chat Completions adapter for the Pragmatic durable-execution runtime: any /v1/chat/completions server as a journaled Oracle."
keywords = ["openai", "llm", "agents", "durable-execution", "ollama"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true

# The zero-dependency rule applies to the core runtime. Adapters talk to the
# outside world, so they carry the minimum needed to do it well: an HTTPS
# client and a JSON codec.
[dependencies]
pragmatic = { version = "0.5.0", path = "../pragmatic", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

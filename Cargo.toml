[workspace]
resolver = "2"
members = [
    "crates/pragmatic",
    "crates/pragmatic-macros",
    "crates/pragmatic-anthropic",
    "crates/pragmatic-cli",
    "crates/pragmatic-console",
    "crates/pragmatic-python",
    "crates/pragmatic-ffi",
    "crates/pragmatic-openai",
    "crates/pragmatic-anchor",
    "crates/pragmatic-server",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
# `File::try_lock`, which the journal directory backend uses for its
# sidecar lock files, is stable from 1.89.
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/pragmaticco/pragmatic"
homepage = "https://aniketh.net/pragmatic/stet/"
readme = "README.md"
authors = ["Pragmatic Research, Inc. <me@aniketh.net>"]

[profile.release]
lto = true
codegen-units = 1

# The Python extension and the C ABI library are loaded at runtime with
# dlopen. On macOS 27 the default release strip of debug info leaves a
# library whose string table dyld rejects ("mis-aligned LINKEDIT string
# pool"), so these two are not stripped. They stay small (about 0.3 MB).
[profile.release.package.pragmatic-python]
strip = "none"

[profile.release.package.pragmatic-ffi]
strip = "none"

name: Release

# Tag a release (e.g. `git tag v0.3.0 && git push --tags`) to publish:
#   - the publishable Rust crates to crates.io (dependency order handled by
#     cargo; publish=false crates like pragmatic-ffi/-python are skipped).
#     Pragmatic Server (crates/pragmatic-server) and its anchoring library
#     (crates/pragmatic-anchor) are commercial software under the Business
#     Source License and are never published to crates.io: they have
#     publish = false, and the job below checks that before publishing
#     anything. The server ships as a container image and binaries instead.
#   - abi3 wheels + sdist for `pragmatic-runtime` to PyPI
#   - the Pragmatic Server container image, built for every tag and pushed
#     only when a registry is configured (secrets below); never on its own
#     from a branch
#
# One-time setup (see RELEASING.md):
#   - repo secret CARGO_REGISTRY_TOKEN: crates.io API token (publish scope)
#   - PyPI trusted publisher for `pragmatic-runtime` pointing at this repo,
#     workflow `release.yml`, environment `pypi` (no token needed)
#   - optional repo secrets CONTAINER_REGISTRY_IMAGE,
#     CONTAINER_REGISTRY_USERNAME and CONTAINER_REGISTRY_TOKEN to push the
#     server image
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is published from a tag the tests, the load test and the fuzz
  # targets have not passed on.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  fuzz:
    uses: ./.github/workflows/fuzz.yml

  crates-io:
    needs: [ci, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the token is configured
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; see RELEASING.md"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: The commercial crates are never published to crates.io
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          meta = json.load(sys.stdin)
          for name in ("pragmatic-server", "pragmatic-anchor"):
              found = [p for p in meta["packages"] if p["name"] == name]
              assert found, f"{name} is missing from the workspace"
              assert found[0]["publish"] == [], f"{name} must have publish = false"
              assert found[0]["license"] == "BUSL-1.1", f"{name} must be BUSL-1.1"
          '
      - name: Publish workspace crates
        # The exclusions repeat publish = false on purpose: the commercial
        # crates must not reach crates.io even if a manifest is edited.
        run: >-
          cargo publish --workspace --no-verify
          --exclude pragmatic-server --exclude pragmatic-anchor
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    needs: [ci, fuzz]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pragmatic-python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/pragmatic-python/dist

  sdist:
    needs: [ci, fuzz]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pragmatic-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: crates/pragmatic-python/dist

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  container:
    name: server container image
    needs: [ci, fuzz]
    runs-on: ubuntu-latest
    # Only for a release tag; the push step also needs the registry secrets.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build -t "pragmatic-server:$VERSION" .
      - name: Smoke test the image
        # Read-only root filesystem and an unprivileged user, as deployed.
        run: |
          docker run --rm --read-only --user 10001:10001 "pragmatic-server:$VERSION" --version
          docker run --rm --read-only --entrypoint openssl "pragmatic-server:$VERSION" version
          docker run --rm --entrypoint ls "pragmatic-server:$VERSION" /etc/pragmatic/tsa-roots
      - name: Push to the configured registry
        env:
          IMAGE: ${{ secrets.CONTAINER_REGISTRY_IMAGE }}
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
        run: |
          if [ -z "$IMAGE" ] || [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "no container registry configured (see RELEASING.md); the image was built and not pushed"
            exit 0
          fi
          REGISTRY="${IMAGE%%/*}"
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
          docker tag "pragmatic-server:$VERSION" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"

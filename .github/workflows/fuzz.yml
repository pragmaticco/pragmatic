name: Fuzz

# The cargo-fuzz targets of design 9 (Journal::parse, frame decoding, json,
# tsp, evidence::from_json and ed25519), each run for ten minutes: weekly,
# on demand, and by release.yml before anything is published. A crash
# uploads its reproducer.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }} (10 minutes)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [journal_parse, frame_decode, json, tsp, evidence_from_json, ed25519]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core is zero-dependency
        run: cargo tree -p pragmatic --no-default-features --edges normal | tail -n +2 | grep -q . && exit 1 || echo "core has no runtime deps"
      - name: OpenSSL for the time-stamp tests
        run: openssl version && openssl ts -help 2>&1 | grep -q -- -partial_chain
      - name: Build every crate
        run: cargo build --workspace --all-targets
      - name: Test (debug), every crate
        run: cargo test --workspace
      - name: Test (release, headline numbers)
        run: cargo test --workspace --release -- --nocapture
      - name: Examples
        run: |
          cargo run --release -p pragmatic --example research_agent
          cargo run --release -p pragmatic --example async_research
          cargo run --release -p pragmatic --example tool_use_retries
          cargo run --release -p pragmatic --example map_reduce
      - name: CLI smoke test
        run: |
          cargo run --release -p pragmatic-cli --example seed_demo -- /tmp/demo
          cargo run --release -p pragmatic-cli -- runs --dir /tmp/demo
          cargo run --release -p pragmatic-cli -- verify --all --dir /tmp/demo
          cargo run --release -p pragmatic-cli -- export research-42 --dir /tmp/demo -o /tmp/run.html
      - name: Console smoke test
        run: |
          cargo run --release -p pragmatic-cli -- serve --dir /tmp/demo --port 7171 &
          sleep 2
          curl -sf http://127.0.0.1:7171/healthz
          curl -sf http://127.0.0.1:7171/ | grep -q research-42
          curl -sf http://127.0.0.1:7171/run/research-42 | grep -q "draw.result"
          kill %1

  python:
    name: python package (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the package
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest anthropic openai httpx2
          cd crates/pragmatic-python
          VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv PATH=$GITHUB_WORKSPACE/.venv/bin:$PATH maturin develop
      - name: Framework packages, where they install
        # The framework tests skip any framework that is not installed, so
        # one that does not install on this Python is reported, not fatal.
        run: |
          for pkg in openai-agents pydantic-ai langchain-anthropic langchain-openai langgraph; do
            .venv/bin/pip install "$pkg" || echo "::warning::$pkg did not install on Python ${{ matrix.python }}; its tests skip"
          done
      - name: Smoke test
        run: .venv/bin/python crates/pragmatic-python/tests/smoke.py
      - name: SDK tests (runtime, server store, HTTP layer, frameworks)
        run: .venv/bin/python -m pytest crates/pragmatic-python/tests -q -rs
      - name: Reference verifier and evidence attacks
        run: |
          cargo build -p pragmatic-cli
          python -I tools/test_verify_evidence.py
          python -I tools/test_evidence_attacks.py

  no-network:
    name: server and SDK tests with outbound network blocked
    # Proves there is no telemetry and no hidden network dependency: the
    # server, anchoring, console and SDK tests run in a network namespace
    # whose only interface is loopback, after everything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
      - name: Build everything while the network is open
        run: |
          cargo build --workspace --all-targets
          cargo test --no-run -p pragmatic-server -p pragmatic-anchor -p pragmatic-console
          python -m venv .venv
          .venv/bin/pip install maturin pytest anthropic openai httpx2
          cd crates/pragmatic-python
          VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv PATH=$GITHUB_WORKSPACE/.venv/bin:$PATH maturin develop
      - name: Allow network namespaces for the runner user
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Tests in a namespace with loopback only
        run: |
          unshare --map-root-user --net bash -euo pipefail -c '
            ip link set lo up
            if curl -sS --max-time 5 -o /dev/null https://example.com; then
              echo "outbound network is reachable; refusing to run" >&2
              exit 1
            fi
            cargo test --offline -p pragmatic-server -p pragmatic-anchor -p pragmatic-console
            .venv/bin/python -m pytest crates/pragmatic-python/tests -q -rs
            python -I tools/test_verify_evidence.py
          '

  bindings:
    name: C++ / Java / Go / Node bindings smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: C ABI tests
        run: cargo test -p pragmatic-ffi
      - name: C++ smoke
        run: bindings/cpp/test.sh
      - name: Java smoke
        run: bindings/java/test.sh
      - name: Go smoke
        run: bindings/go/test.sh
      - name: Node smoke
        run: bindings/node/test.sh

  live-api:
    name: live Anthropic API (needs secret)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Live record + replay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no ANTHROPIC_API_KEY secret configured; skipping live test"
          else
            cargo test -p pragmatic-anthropic -- --ignored
          fi

  msrv-and-min:
    name: core builds without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-pc-windows-gnu
      - run: cargo check -p pragmatic --no-default-features
      # The OS randomness module has per-platform FFI; check that the
      # Windows declarations compile without needing a Windows runner.
      - run: cargo check -p pragmatic --all-targets --target x86_64-pc-windows-msvc
      - run: cargo check -p pragmatic --all-targets --target x86_64-pc-windows-gnu

  os-randomness:
    name: core OS randomness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p pragmatic --lib "rand::"
